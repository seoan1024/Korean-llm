      <text x="70" y="78" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">v4</text>
      <text x="70" y="144" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Pretrain</text>
      <text x="70" y="171" text-anchor="middle" font-size="14" fill="#94a3b8">→ SFT</text>
